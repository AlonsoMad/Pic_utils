[project]
name = "pic-utils"
version = "0.1.0"
description = "A laboratory for experimental image art"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.13,<5",
    "pillow>=11,<14",
    "scikit-image>=0.25,<0.27",
    "scikit-learn>=1.5,<2",
    "pyside6>=6.8,<7",
    "psutil>=6,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "matplotlib>=3.9",
]

[project.scripts]
pic-utils = "pic_utils.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pic_utils"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The legacy monolith is quarantined by P0-02; keep `ruff check .` /
# `ruff format --check .` green until it is deleted.
extend-exclude = ["pic_utils.py", "*.md"]  # *.md: specs are human-owned; code blocks there are illustrative, not linted

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running performance tests",
    "gui: requires Qt",
]
pythonpath = ["src"]
